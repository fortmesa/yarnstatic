name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Deliberately minimal and READ-ONLY at the workflow level -- each job below
# restates its own `permissions:` block instead. GitHub Actions REPLACES the
# workflow-level default with a job's own block rather than merging the two,
# so this isn't documentation-by-omission: `release` (the only job that
# needs contents:write) declares it explicitly, and every other job gets
# nothing beyond what checkout needs.
permissions:
  contents: read

jobs:
  # The ONLY job that fetches dependencies over the network -- Go modules
  # (go mod download) and each of the two Yarn plugin subprojects' own
  # node_modules (yarn install --immutable, which is also the one place a
  # compromised transitive dependency's postinstall script, the
  # "Shai-Hulud" class of supply-chain attack, could execute). Every job
  # after this one restores dependencies from cache, so none of them fetch
  # a module or package from the Go proxy or npm registry, and none of them
  # run a dependency's install-time lifecycle script. They do still
  # download tools. setup-go fetches the Go toolchain when the runner image
  # lacks that version, and corepack fetches yarn itself, which the hash
  # in each package.json's packageManager field pins.
  install:
    name: Install
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6.5.0
        with:
          go-version-file: go.mod
          cache: false   # explicit cache/save below instead -- see "Cache Go modules" step

      - name: Download Go modules
        run: go mod download

      - name: Cache Go modules for this run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ github.sha }}

      # ubuntu-slim already ships a Node version well within Yarn 4's floor,
      # and corepack with it -- no setup-node step needed here. (Confirmed
      # directly: every fortmesa repo using this same install/test/build
      # split -- the verdaccio-* plugin repos -- runs this way unmodified.)
      - name: Enable corepack
        run: corepack enable

      - name: Install yarn-plugin-yarnstatic dependencies
        working-directory: plugins/yarn-plugin-yarnstatic
        run: yarn install --immutable

      # .yarn/install-state.gz travels with node_modules so Yarn recognizes
      # the tree as already-installed downstream and never tries an implicit
      # revalidation-triggered network fetch of its own.
      - name: Cache yarn-plugin-yarnstatic node_modules for this run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            plugins/yarn-plugin-yarnstatic/node_modules
            plugins/yarn-plugin-yarnstatic/.yarn/install-state.gz
          key: node-modules-yarn-plugin-yarnstatic-${{ github.sha }}

      - name: Install yarn-plugin-yarnstatic-s3 dependencies
        working-directory: plugins/yarn-plugin-yarnstatic-s3
        run: yarn install --immutable

      - name: Cache yarn-plugin-yarnstatic-s3 node_modules for this run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            plugins/yarn-plugin-yarnstatic-s3/node_modules
            plugins/yarn-plugin-yarnstatic-s3/.yarn/install-state.gz
          key: node-modules-yarn-plugin-yarnstatic-s3-${{ github.sha }}

      - name: Install cli-node dependencies
        working-directory: cli-node
        run: yarn install --immutable

      - name: Cache cli-node node_modules for this run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            cli-node/node_modules
            cli-node/.yarn/install-state.gz
          key: node-modules-cli-node-${{ github.sha }}

  # Fetches no dependencies: restores everything install already fetched,
  # and GOPROXY=off/GOFLAGS=-mod=readonly turn any gap in the Go module
  # cache into a loud failure instead of a silent live fetch
  # (fail-on-cache-miss: true does the same job for the node_modules
  # restores below). setup-go can still download the Go toolchain itself.
  test:
    name: Test
    needs: install
    runs-on: ubuntu-slim
    env:
      GOPROXY: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Enable corepack
        run: corepack enable

      - name: Restore yarn-plugin-yarnstatic node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            plugins/yarn-plugin-yarnstatic/node_modules
            plugins/yarn-plugin-yarnstatic/.yarn/install-state.gz
          key: node-modules-yarn-plugin-yarnstatic-${{ github.sha }}
          fail-on-cache-miss: true

      # Deliberately node test/smoke.js only, not test/cli-real.js -- that
      # one drives real yarn 3.x/4.x releases via corepack against the real
      # npm registry (see its own file-level comment), which is
      # fundamentally incompatible with this job having no network access.
      # It's a manual/local-only check, not part of this pipeline.
      - name: Test yarn-plugin-yarnstatic
        working-directory: plugins/yarn-plugin-yarnstatic
        run: node test/smoke.js

      - name: Restore yarn-plugin-yarnstatic-s3 node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            plugins/yarn-plugin-yarnstatic-s3/node_modules
            plugins/yarn-plugin-yarnstatic-s3/.yarn/install-state.gz
          key: node-modules-yarn-plugin-yarnstatic-s3-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Test yarn-plugin-yarnstatic-s3
        working-directory: plugins/yarn-plugin-yarnstatic-s3
        run: node test/smoke.js

      - name: Restore cli-node node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            cli-node/node_modules
            cli-node/.yarn/install-state.gz
          key: node-modules-cli-node-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Test cli-node
        working-directory: cli-node
        run: node test/smoke.js

  build-go:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [install, test]
    runs-on: ubuntu-slim
    env:
      GOPROXY: "off"
      GOFLAGS: "-mod=readonly"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ github.sha }}
          fail-on-cache-miss: true

      # -X main.version=... matches the exact tag this release is published
      # under (the same tag the `release` job publishes the GitHub release
      # under) -- so `yarnstatic version` and the release it came from can
      # never drift apart. The tag is read from GITHUB_REF_NAME rather than
      # substituted into the script, so a tag name can't inject shell.
      - name: Build yarnstatic
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
            -o "dist/yarnstatic-$GOOS-$GOARCH" \
            ./cmd/yarnstatic

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: yarnstatic-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-js:
    name: Build ${{ matrix.plugin }}
    needs: [install, test]
    runs-on: ubuntu-slim
    strategy:
      matrix:
        plugin:
          - yarn-plugin-yarnstatic
          - yarn-plugin-yarnstatic-s3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            plugins/${{ matrix.plugin }}/node_modules
            plugins/${{ matrix.plugin }}/.yarn/install-state.gz
          key: node-modules-${{ matrix.plugin }}-${{ github.sha }}
          fail-on-cache-miss: true

      # Comment/whitespace-stripped bundle via @yarnpkg/builder -- see each
      # plugin's own README for why this step exists.
      - name: Build
        working-directory: plugins/${{ matrix.plugin }}
        run: yarn build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: plugin-bundle-${{ matrix.plugin }}
          path: plugins/${{ matrix.plugin }}/bundles/@yarnpkg/*.js
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-go, build-js]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      # Pulls both build-go's yarnstatic-<goos>-<goarch> binaries and
      # build-js's plugin-<name>.js bundles into the same flat dist/ dir.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Assemble plugins and install script
        run: |
          set -eu
          mv dist/plugin-yarnstatic.js dist/plugin-yarnstatic.cjs
          mv dist/plugin-yarnstatic-s3.js dist/plugin-yarnstatic-s3.cjs
          cp install.sh dist/install.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      # release-s3 (below) downloads this instead of re-running the
      # assemble/checksum steps itself -- guarantees the exact same bytes
      # land in both the GitHub release and S3, computed once.
      - name: Upload assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Replaces the action's fail_on_unmatched_files. With no match, bash
          # passes the literal string dist/* to gh and the upload fails late.
          ls dist/* >/dev/null
          # A re-run finds the release its first attempt made and replaces
          # the assets on it, rather than failing on create and skipping
          # release-s3. --verify-tag fails if the tag is gone, where gh would
          # otherwise create it at the default branch, a different commit
          # from the one built.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi

  release-s3:
    name: Publish to S3
    needs: release
    runs-on: ubuntu-slim
    # Maps to a GitHub Environment of the same name -- this is what makes
    # gha-s3-yarnstatic's trust policy (FMDEV account, see the setup command
    # given alongside this workflow) actually mean something: the policy
    # checks `sub: repo:fortmesa/yarnstatic:environment:s3-release`, a claim
    # GitHub itself mints server-side from this job's declared environment.
    # This environment needs a TAG policy (this workflow triggers on tag
    # push, not branch push), not the branch policy every other job in this
    # org's workflows uses.
    environment: s3-release
    # Least privilege, and REPLACES (not adds to) the workflow-level
    # default: id-token:write to mint the OIDC token below, nothing else --
    # this job never checks out repo source, it only needs release's
    # already-assembled dist/.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b   # v6.2.1
        with:
          role-to-assume: arn:aws:iam::869756787046:role/gha-s3-yarnstatic
          aws-region: us-east-1

      # Same items as the GitHub release (each plugin, the Go binary per
      # platform, install.sh, checksums.txt), one directory per version so
      # a re-run of this tag is idempotent (PutObject overwrite) without
      # touching any other version's prefix.
      - name: Publish to S3
        run: aws s3 cp dist/ "s3://fmdev-npmjs-storage/fortmesa/yarnstatic/$GITHUB_REF_NAME/" --recursive

  publish-npm:
    name: Publish @fortmesa/yarnstatic to npm
    # Depends on build-js (not just test) so there is exactly one build of
    # yarn-plugin-yarnstatic-s3's bundle for this whole workflow run --
    # reused here via download-artifact below, never rebuilt independently.
    # Two separate builds of the same source, one in build-js and one
    # redone here, would mean two places a build failure could originate
    # and no single answer for "which build is the one that shipped."
    needs: build-js
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Restore cli-node node_modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            cli-node/node_modules
            cli-node/.yarn/install-state.gz
          key: node-modules-cli-node-${{ github.sha }}
          fail-on-cache-miss: true

      # The one build of yarn-plugin-yarnstatic-s3's bundle, already done by
      # build-js -- placed at exactly the path cli-node's own prepack script
      # (scripts/build-plugin-bundle.js) checks first, so its
      # needsBuild() sees an up-to-date bundle already present and copies
      # it into cli-node/plugin/ instead of invoking `yarn build` again.
      - name: Download pre-built yarn-plugin-yarnstatic-s3 bundle from build-js
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: plugin-bundle-yarn-plugin-yarnstatic-s3
          path: plugins/yarn-plugin-yarnstatic-s3/bundles/@yarnpkg

      # npmjs.dev.fort.blue (via verdaccio-oidc-auth) verifies a GitHub
      # Actions OIDC token directly as a bearer credential -- no OAuth
      # exchange, no browser. Same pattern already used by
      # verdaccio-security-filter's own release.yml for this same registry.
      - name: Get OIDC token for npmjs.dev.fort.blue
        id: oidc
        run: |
          set -eu
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://npmjs.dev.fort.blue" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d).value))')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # working-directory: cli-node so this writes to cli-node/.yarnrc.yml
      # (this job's ephemeral checkout) -- cli-node is the actual yarn
      # project here, since the repo root itself is a Go module with no
      # yarn project of its own. Never written to any committed config.
      - name: Configure npm registry for @fortmesa scope
        working-directory: cli-node
        env:
          NPM_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -eu
          yarn config set 'npmScopes.fortmesa.npmRegistryServer' 'https://npmjs.dev.fort.blue'
          yarn config set 'npmScopes.fortmesa.npmPublishRegistry' 'https://npmjs.dev.fort.blue'
          yarn config set 'npmScopes.fortmesa.npmAlwaysAuth' true
          yarn config set 'npmScopes.fortmesa.npmAuthToken' "$NPM_TOKEN"

      # cli-node/package.json's version is independent of this repo's own
      # v*.*.* git tags (same as yarn-plugin-yarnstatic-s3's own
      # package.json version already is -- neither plugin's version is
      # tied to the Go binary's release tag). Most tags won't bump it, and
      # npm rejects republishing an already-published version outright, so
      # skip cleanly here instead of failing the whole release whenever
      # there's nothing new to publish.
      - name: Check whether this version is already published
        id: version-check
        working-directory: cli-node
        run: |
          set -eu
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          if yarn npm info "@fortmesa/yarnstatic@$LOCAL_VERSION" --json >/dev/null 2>&1; then
            echo "@fortmesa/yarnstatic@$LOCAL_VERSION is already published -- skipping"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@fortmesa/yarnstatic@$LOCAL_VERSION is not yet published -- will publish"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.dev.fort.blue
        if: steps.version-check.outputs.should-publish == 'true'
        working-directory: cli-node
        run: yarn npm publish --access public --provenance
