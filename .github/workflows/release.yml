name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Deliberately minimal and READ-ONLY at the workflow level -- each job below
# restates its own `permissions:` block instead. GitHub Actions REPLACES the
# workflow-level default with a job's own block rather than merging the two,
# so this isn't documentation-by-omission: `release` (the only job that
# needs contents:write) declares it explicitly, and `test`/`build` -- which
# both implicitly fetch and run Go module dependencies via `go vet`/`go
# test`/`go build`, the same untrusted-code exposure this pattern isolates
# everywhere else in this org -- get nothing beyond what checkout needs.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6.5.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-slim
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6.5.0
        with:
          go-version-file: go.mod

      # -X main.version=... matches the exact tag this release is published
      # under (same github.ref_name the `release` job's softprops/action-gh-release
      # step defaults to) -- so `yarnstatic version` and the release it came
      # from can never drift apart.
      - name: Build yarnstatic
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/yarnstatic-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/yarnstatic

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: yarnstatic-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Assemble plugin and install script
        run: |
          set -eu
          cp plugins/yarn-plugin-yarnstatic/sources/index.js dist/plugin-yarnstatic.cjs
          cp install.sh dist/install.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b   # v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
